name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  entrypoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test OAuth key bootstrap
        run: ./tests/entrypoint_test.sh
      - name: Build image
        run: docker build -t probo-railway-template:test .
      - name: Test Railway volume initialization
        run: ./tests/image_test.sh probo-railway-template:test
